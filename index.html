const comics=[
 ['court','Duck Court','A khatarnak voice note stands accused. Your Majesty, the mic is yours.','Hear the case','#ebd5a9','👑 Her Merciful Majesty'],
 ['balloons','Things you said','Five balloons, five tiny memories. Pop them in any order.','Pop a memory','#f1ced0','🎈 Keeper of Little Things'],
 ['dance','The pending dance','You said “Done done.” The ducks have been rehearsing ever since.','Take the floor','#e2d5ea','🎵 The Done Done Duet'],
 ['moons','A planet by Ducky','Four directions. Four moons. A world that follows your rules.','Raise the moons','#cadadf','🌙 Architect of Four Moons'],

let book={};try{book=JSON.parse(localStorage.getItem('ducky-five-pages-v1'))||{}}catch{}
let animation=0;
function stop(){cancelAnimationFrame(animation)}
$('dialog').onclose=stop;$('close').onclick=()=>$('dialog').close();
function panel(tag,title,story){stop();if(!$('dialog').open)$('dialog').showModal();$('tag').textContent=tag;$('title').textContent=title;$('story').textContent=story;$('msg').textContent='';$('scene').replaceChildren();$('buttons').replaceChildren()}
function button(s,fn){let b=document.createElement('button');b.textContent=s;b.onclick=fn;$('buttons').append(b)}
function art(i){let im=document.createElement('img');im.className='strip';im.src=imgs[comics[i][0]];im.alt='';$('scene').append(im)}
function slip(s,type='stamp'){let el=document.createElement('div');el.className=type;el.textContent=s;$('scene').append(el)}
function draw(){let n=comics.filter((_,i)=>book[i]).length;$('count').textContent=n+'/5';$('lock').textContent=n===5?'Open note ↗':'Sealed · '+n+'/5';$('cards').replaceChildren();comics.forEach(([img,title,d,cta,color],i)=>{let c=document.createElement('article');c.style.setProperty('--c',color);c.innerHTML='<div class="art"><img src="'+imgs[img]+'" alt=""><span class="tab">COMIC 0'+(i+1)+'</span></div><div class="body"><h3>'+title+'</h3><p>'+d+'</p><button>'+cta+' ↗</button></div>';c.querySelector('button').onclick=()=>start(i);$('cards').append(c)})}
function award(i,caption){book[i]=caption;try{localStorage.setItem('ducky-five-pages-v1',JSON.stringify(book))}catch{}draw();panel('STICKER EARNED',comics[i][5],caption);art(i);if(i<4)button('Turn the page →',()=>start(i+1));else button('Open the folded note',note);button('My sticker book',album);button('Back to scrapbook',()=>$('dialog').close())}
function album(){panel('DUCKY’S COLLECTION','My sticker book','Tap a sticker to revisit the ending you made.');comics.forEach((c,i)=>button(book[i]?c[5]:'♡  '+c[1]+' · play to collect',()=>book[i]?award(i,book[i]):start(i)));if(comics.every((_,i)=>book[i]))button('Open Kevin’s note ✉',note)}
function court(){panel('DUCK COURT · EXHIBIT A','The People vs. Kevin','Charge: saying “ek sec” and sending a khatarnak voice note. The court may examine one piece of evidence.');art(0);[['Inspect the transcript','“Short version…” followed by three separate short versions.'],['Call the witness','The moon says it rose, set, and came back for part two.']].forEach(([s,e])=>button(s,()=>{panel('DUCK COURT · THE VERDICT','Order in the pond!',e+'\n\nKevin pleads: “MERCY My Queen.” Aapka verdict?');art(0);button('Grant royal mercy',()=>award(0,'VERDICT: Pardoned. The next “ek sec” will be timed with a stopwatch.'));button('Limit him to three words',()=>award(0,'VERDICT: Guilty. His next voice note gets three words: “Aap sahi hain.”'))}))}

 ['Caught laughing','I complained that you laughed when I jumped. Your defence was that you were laughing the entire time. Absolutely zero remorse 😂'],

function planet(){panel('PAGE FOUR · WORLD BUILDER','Where should the moon rise?','On your planet, each direction gets a moon with its own light. Tap a direction to hang one.');let sky=document.createElement('div');sky.className='sky';sky.innerHTML='<span>🌳</span>';$('scene').append(sky);let count=0;[['North','N','A moon for the conversations that start with “random question…”'],['East','E','A moon for the smile you try to hide when I’m being dramatic.'],['South','S','A moon for the evenings you want all to yourself.'],['West','W','And one whose only job is to look pretty over your tent.']].forEach(([name,dir,caption])=>{let b=document.createElement('button');b.className='moon moon'+dir;b.textContent=name+' +';sky.append(b);b.onclick=()=>{b.disabled=true;b.textContent='☾ '+name;$('story').textContent=caption;if(++count===4){$('msg').textContent='All four are up. Set the clock for your planet.';['Night in the daytime','Sunrise at midnight'].forEach(v=>button(v,()=>award(3,v+'. Four moons, four directions, every one with its own light. Your planet, exactly how you imagined it.')))}}})}
function lake(){panel('PAGE FIVE · CHANDRATAAL','Pitch your tent','Imagine you’ve reached the lake. Where should the tent face?');art(4);['Towards the still water','Towards the moonrise'].forEach(view=>button(view,()=>{panel('CHANDRATAAL · AFTER SUNSET','What do you hear?',view+'. The kettle is warming. Pick the sound you want to stay with.');art(4);['The little fire crackling','Water against the shore','Only the breeze'].forEach(sound=>button(sound,()=>{panel('CHANDRATAAL · YOUR POSTCARD','Wish you were here.','I remember you wanting a place like this. I hope someday you actually get to sit there, finish your chai while it’s warm, and have absolutely nowhere else to be.');slip(view+' · '+sound,'postcard');button('Keep my postcard',()=>award(4,view+'. '+sound+'. A tent, warm chai and a whole evening to yourself. — Kevin'));button('Try another view',lake)}))}))}
function start(i){[court,balloons,dancing,planet,lake][i]()}
function note(){if(!comics.every((_,i)=>book[i])){panel('SEALED WITH A DAISY','A folded note','The last page is a letter. Finish the remaining adventures to unfold it.');comics.forEach((c,i)=>{if(!book[i])button(c[1],()=>start(i))});return}
 const pages=[
 ['Ducky, ek sec…','Voice note nahi hai, pakka 😂\n\nAapko yaad hai jab maine poocha tha ki aapka apna planet kaisa hoga? Mujhe laga tha bas thodi der baat hogi. Phir aapne bataya ki chaaron directions mein ek ek moon hoga aur har moon ki apni roshni hogi. Ab kabhi kabhi main chaand dekhta hoon toh mujhe woh extra detail yaad aa jaati hai.'],
 ['Aapke saath ek cheez hai…','Kabhi main poori speech tayyar karke baithta hoon aur aap ek line mein mujhe hasa deti hain. Jaise main complain kar raha tha ki mere koodne pe aap hansi thi, aur aap boli ki aap toh poora time hi hass rahi thi. Meri complaint ka kya hi hona tha phir 😂\n\nAur jab kuch kehna mushkil hota hai, tab bhi mann karta hai aapko bataun. Itna bharosa hona ki main apni baat apne hi ajeeb tareeke se keh sakta hoon… mere liye ye bahut badi cheez hai.'],
 ['Bas ye kehna tha','I’m really glad you’re my friend, Ducky. Hamari dosti mere liye bahut precious hai. Kabhi din busy ho aur bas ek “hnji” jitni baat ho paaye, tab bhi aapki jagah mere din mein bani rehti hai.\n\nKabhi Chandrataal ke paas tent mein baith ke chai piyein, toh phone bag mein hi rehne denge. Aur agar filhaal bas campus mein do minute milte hain, toh woh bhi mujhe bahut achhe lagte hain.\n\nP.S. Woh dance sach mein baaki hai. “Done done” ka written proof mere paas hai.\n— Kevin']
 ];function page(i){panel('KEVIN’S LETTER · '+(i+1)+' / 3',...pages[i]);if(i>0)button('← Previous fold',()=>page(i-1));if(i<2)button('Unfold the next page →',()=>page(i+1));else button('Back to our scrapbook ♡',()=>$('dialog').close())}page(0)}
